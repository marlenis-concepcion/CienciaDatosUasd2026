[project]
name = "tutoria-dss"
version = "1.0.0"
description = "DSS de alerta temprana para priorizar tutorías universitarias (INF-8239, trabajo final)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fairlearn>=0.12,<0.13",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "nbconvert>=7.16,<8",
  "pytest>=8.3,<9",
  "reportlab>=4.2,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutoria_dss"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
